# Three abaplint checks on every pull request. Copy this folder into an abapGit repository
# (sources under src/) and keep the configs you need:
#
# syntax-740   abaplint-syntax.json: syntax of the lowest release you support (v740sp08 here).
#              Catches statements a newer development system accepts but the target does not.
# abap-cloud   abaplint-cloud.json: ABAP Cloud language version; SAP objects allowed are the ones
#              released in ABAP Cloud AND present on 7.40
#              (https://github.com/abapedia/steampunk-2305-api-intersect-740). Delete the job if
#              the code never runs in the cloud.
# clean-abap   abaplint-clean.json: the Clean ABAP rules abaplint can check, with the guide's
#              naming patterns. Set syntax.errorNamespace to your namespace.
#
name: abaplint

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  syntax-740:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: abaplint, ABAP 7.40 SP08
        run: |
          if [ -z "$(find src -type f 2>/dev/null | head -1)" ]; then echo "No sources yet."; exit 0; fi
          npx --yes @abaplint/cli@2.120.90 abaplint-syntax.json --format json > abaplint-result.json || true
          node .github/abaplint-annotate.js abaplint-result.json "abaplint 7.40"

  abap-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: abaplint, ABAP Cloud
        run: |
          if [ -z "$(find src -type f 2>/dev/null | head -1)" ]; then echo "No sources yet."; exit 0; fi
          npx --yes @abaplint/cli@2.120.90 abaplint-cloud.json --format json > abaplint-result-cloud.json || true
          node .github/abaplint-annotate.js abaplint-result-cloud.json "abaplint ABAP Cloud"

  clean-abap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: abaplint, Clean ABAP
        run: |
          if [ -z "$(find src -type f 2>/dev/null | head -1)" ]; then echo "No sources yet."; exit 0; fi
          npx --yes @abaplint/cli@2.120.90 abaplint-clean.json --format json > abaplint-result-clean.json || true
          node .github/abaplint-annotate.js abaplint-result-clean.json "abaplint Clean ABAP"
