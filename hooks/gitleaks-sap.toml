# Default gitleaks rules plus allowlists for SAP values that look like secrets but are not.
# Used by gitleaks-pre-push.py when the repository has no .gitleaks.toml of its own and
# GITLEAKS_CONFIG is not set. Keep every entry narrow: match the whole line shape, not a word.

[extend]
useDefault = true

[[allowlists]]
description = "SAP archive key in ABAP: archive file number, optional -NNN, archiving object (for example FI_DOCUMNT)"
regexTarget = "line"
regexes = [
  "(?i)archiv(e)?_?key\\s*=\\s*'\\d{2,6}(-\\d{3})?[A-Z][A-Z0-9_]{1,9}'",
]
